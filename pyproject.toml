[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstcall"
version = "0.1.0"
description = "Synthetic customer monitoring for autonomous agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["firstcall*"]
exclude = ["tests*", "artifacts*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
